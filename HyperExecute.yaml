version: "0.1"

image: playwrightjs

globalTimeout: 150
testSuiteTimeout: 150
testSuiteStep: 150

runson: linux
alwaysRunPostSteps: true
concurrency: 1

env:
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    HTTP_PROXY: "http://proxy.wellsfargo.com:8080"
    HTTPS_PROXY: "http://proxy.wellsfargo.com:8080"
    NODE_TLS_REJECT_UNAUTHORIZED: "0"

cacheKey: '{{ checksum "package.json" }}'
cacheDirectories:
  - node_modules

autosplit: true

project:
  name: PROJECTNAME
  id: PROJECTID

globalPre:
  commands:
    - echo "Starting npm install..."
    - npm config set registry https://artifactory.wellsfargo.com/artifactory/api/npm/npm-lqed-virtual/
    - npm i


uploadArtefacts:
  - name: PW Reports
    path:
      - playwright-report/**

# Enable report generation
report: true
partialReports:
    frameworkName: ""
    #frameworkName: playwright
    location: playwright-report
    type: html
    #email:
     #   to:
      #    - mohana.moorkodi@wellsfargo.com

testDiscovery:
  type: raw
  mode: remote
  command: ls tests
  #command: grep "test(" tests/*.spec.ts | sed "s/test('\(.*\)', async ({ page }) => {/\1/"
#testRunnerCommand: npx playwright test -g "$test"
testRunnerCommand: npx playwright test tests/tests/sampleTest.spec.ts

post:
  - ls -la


jobLabel: [playwrightTS]